<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <script src="https://app.splus.ir/js/soroush-web-app.js"></script>

    <title>چالش شعرانه</title>

    <link rel="stylesheet" href="/miniapp/style.css">
</head>

<body>

    <main class="app">

        <section id="homeScreen" class="screen active">
            <div class="logo">🌿</div>

            <h1>چالش شعرانه</h1>

            <p class="subtitle">
                دانسته‌های ادبی خود را در سه سطح بیازمایید
            </p>

            <div class="levels">
                <button class="level-btn" data-level="ashenaei">
                    <span>آشنایی</span>
                    <small>سطح مقدماتی</small>
                </button>

                <button class="level-btn" data-level="danaei">
                    <span>دانایی</span>
                    <small>سطح متوسط</small>
                </button>

                <button class="level-btn" data-level="ostad">
                    <span>استادی</span>
                    <small>سطح پیشرفته</small>
                </button>
            </div>
        </section>

        <section id="gameScreen" class="screen">

            <div class="game-header">
                <div>
                    <span class="label">سطح</span>
                    <strong id="levelName">آشنایی</strong>
                </div>

                <div>
                    <span class="label">امتیاز</span>
                    <strong id="score">۰</strong>
                </div>

                <div>
                    <span class="label">سؤال</span>
                    <strong>
                        <span id="questionNumber">۱</span>
                        / ۷
                    </strong>
                </div>
            </div>

            <div class="timer-container">
                <div class="timer" id="timer">۱:۳۰</div>
            </div>

            <div class="question-card">
                <div class="question" id="questionText">
                    در حال آماده‌سازی سؤال...
                </div>

                <div class="options" id="options"></div>
            </div>

            <button id="stopButton" class="stop-btn">
                ⛔ توقف چالش
            </button>

        </section>

        <section id="resultScreen" class="screen">

            <div class="result-icon">🏆</div>

            <h2>چالش به پایان رسید</h2>

            <div class="result-card">

                <div class="result-row">
                    <span>سطح</span>
                    <strong id="resultLevel">آشنایی</strong>
                </div>

                <div class="result-row">
                    <span>امتیاز نهایی</span>
                    <strong id="finalScore">۰</strong>
                </div>

                <div id="resultMessage" class="result-message"></div>

            </div>

            <button id="restartButton" class="primary-btn">
                🔄 شروع دوباره
            </button>

        </section>

    </main>

    <script src="/miniapp/app.js"></script>

</body>
</html>
